<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ER Studio · Entity Resolution</title>
<style>
:root{--a:#8b5cf6;--b:#22d3ee;--c:#f472b6;--d:#a3e635;--t:#eef0ff;--m:#9aa0c8;--g:rgba(255,255,255,.07);--l:rgba(255,255,255,.14)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--t);font:14px/1.5 Inter,system-ui,Segoe UI,sans-serif;background:radial-gradient(900px 500px at 10% -10%,#5b21b6aa,transparent),radial-gradient(800px 500px at 100% 0,#0e7490aa,transparent),radial-gradient(700px 500px at 50% 110%,#9d174daa,transparent),#0b0a1f;background-attachment:fixed}
nav{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:6px;padding:12px 4vw;background:#0b0a1fcc;backdrop-filter:blur(14px);border-bottom:1px solid var(--l);flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;margin-right:14px;background:linear-gradient(90deg,var(--b),var(--c));-webkit-background-clip:text;color:transparent}
nav a{color:var(--m);text-decoration:none;padding:7px 13px;border-radius:99px;font-weight:600;font-size:13px}nav a:hover{color:var(--t)}nav a.on{color:#fff;background:linear-gradient(90deg,#7c3aed,#0891b2)}
main{max-width:1240px;margin:auto;padding:28px 4vw 60px}h2{margin:0 0 4px;font-size:26px}.sub{color:var(--m);margin:0 0 22px}h3{margin:0 0 12px;font-size:15px}
.card{background:var(--g);border:1px solid var(--l);border-radius:18px;padding:20px;backdrop-filter:blur(16px);box-shadow:0 10px 40px #0005,inset 0 1px 0 #ffffff14}
.grid{display:grid;gap:16px;margin-bottom:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.st b{display:block;font-size:30px;font-weight:800;background:linear-gradient(90deg,var(--b),var(--a));-webkit-background-clip:text;color:transparent}.st span{color:var(--m);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.st i{display:block;color:var(--m);font-size:12px;font-style:normal}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--m);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--l)}td{padding:9px 10px;border-bottom:1px solid #ffffff0d;vertical-align:top}tr.k{cursor:pointer}tr.k:hover td{background:#ffffff0a}
.tw{overflow-x:auto}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input,select,button{font:inherit;color:var(--t);background:#ffffff12;border:1px solid var(--l);border-radius:10px;padding:9px 12px}select option{color:#000}input:focus{outline:2px solid var(--a)}
button{cursor:pointer;background:linear-gradient(90deg,#7c3aed,#0891b2);border:0;font-weight:700}button.s{background:#ffffff14;border:1px solid var(--l)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;margin:1px 3px 1px 0;background:#22d3ee22;color:var(--b)}.chip.c3{background:#f472b622;color:var(--c)}.chip.ok{background:#a3e63522;color:var(--d)}.chip.no{background:#f8717122;color:#f87171}
.row{display:flex;align-items:center;gap:10px;margin:7px 0}.row label{width:130px;color:var(--m);font-size:12px;flex:none}.row .tr{flex:1;height:9px;border-radius:9px;background:#ffffff14;overflow:hidden}.row .tr i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--a),var(--b))}.row em{width:52px;text-align:right;font-style:normal;font-variant-numeric:tabular-nums;font-size:12px}
.pg{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:14px;color:var(--m)}.ev{background:#0003;border-radius:12px;padding:14px 16px;margin:4px 0 10px}
svg text{fill:var(--m);font-size:11px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}.mut{color:var(--m)}.pipe{display:flex;gap:8px;flex-wrap:wrap}.pipe div{flex:1;min-width:120px;padding:12px;border-radius:12px;background:#ffffff0d;border:1px solid var(--l);text-align:center;font-weight:600}.pipe small{display:block;color:var(--m);font-weight:400}
.load{padding:60px;text-align:center;color:var(--m)}
</style></head><body>
<nav><span class="logo">◆ ER Studio</span><a href="#/">Dashboard</a><a href="#/project">Project & Data</a><a href="#/map">Entity Map</a><a href="#/matches">Matches</a><a href="#/unmatched">Unmatched</a><a href="#/lab">Model Lab</a><a href="#/live">Live Matcher</a></nav>
<main id="v"></main>
<script>
const v=document.getElementById('v'),$=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),n0=x=>Number(x).toLocaleString(),pc=x=>(x*100).toFixed(1)+'%';
const C={};const get=async u=>C[u]||(C[u]=await (await fetch(u)).json());let PG=()=>{};
const stat=(l,b,s='')=>`<div class="card st"><span>${l}</span><b>${b}</b><i>${s}</i></div>`;
const bars=(d,max)=>{max=max||Math.max(...d.map(x=>x[1]),1e-9);return d.map(([l,x,t])=>`<div class="row"><label title="${e(l)}">${e(l)}</label><div class="tr"><i style="width:${Math.max(1,x/max*100)}%"></i></div><em>${t??n0(x)}</em></div>`).join('')};
const pager=(t,p,s)=>`<div class="pg">${n0(t)} rows · page ${p+1}/${Math.max(1,Math.ceil(t/s))} <button class="s" onclick="PG(${p-1})" ${p<1?'disabled':''}>‹</button><button class="s" onclick="PG(${p+1})" ${(p+1)*s>=t?'disabled':''}>›</button></div>`;
const chip=(m)=>`<span class="chip ${m.source==3?'c3':''}">${m.id} · ${Math.round(m.conf*100)}%</span>`;
const SRC=['','Source 1','Source 2','Source 3'];
function line(series,w=380,h=270){const X=x=>40+x*(w-56),Y=y=>h-30-y*(h-50),col=['#8b5cf6','#22d3ee','#f472b6'];let s=`<svg viewBox="0 0 ${w} ${h}" width="100%">`;
 for(let i=0;i<=4;i++){s+=`<line x1="40" x2="${w-16}" y1="${Y(i/4)}" y2="${Y(i/4)}" stroke="#fff2"/><text x="6" y="${Y(i/4)+4}">${i/4}</text><text x="${X(i/4)-6}" y="${h-10}">${i/4}</text>`}
 series.forEach((q,i)=>s+=`<polyline fill="none" stroke="${col[i]}" stroke-width="2.5" points="${q.pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/><text x="${w-140}" y="${22+i*15}" style="fill:${col[i]}">● ${q.name}</text>`);return s+'</svg>'}

const P={};
P['/']=async()=>{const[o,m]=await Promise.all([get('/api/overview'),get('/api/metrics')]),S=o.splits,tot=k=>Object.values(S).reduce((a,s)=>a+s[k].n,0),r=o.record_level,ch=m.models[m.champion].test;
 const cty={};for(const s of Object.values(S))for(const k of[1,2,3])for(const[c,x]of Object.entries(s[k].countries))cty[c]=(cty[c]||0)+x;
 const q=k=>{const a=Object.values(S).map(s=>s[k]),n=tot(k),w=f=>a.reduce((t,s)=>t+s[f]*s.n,0)/n;return `<tr><td><b>${SRC[k]}</b></td><td>${n0(n)}</td><td>${w('avg_name_len').toFixed(1)}</td><td>${a.reduce((t,s)=>t+s.unique_names,0)}</td><td>${(a.reduce((t,s)=>t+s.missing.address*s.n,0)/n).toFixed(2)}%</td><td>${(a.reduce((t,s)=>t+s.missing.country*s.n,0)/n).toFixed(2)}%</td></tr>`};
 return `<h2>Dashboard</h2><p class="sub">Dataset overview and headline results of the entity-resolution pipeline — Source 1 is the anchor; Source 2 and 3 are matched against it.</p>
 <div class="grid g4">${stat('Source 1 records',n0(tot(1)),'anchor · 25,000 target')}${stat('Source 2 records',n0(tot(2)),'15,000 target')}${stat('Source 3 records',n0(tot(3)),'15,000 target')}${stat('Champion model',m.champion,'picked on validation F0.5')}</div>
 <div class="grid g4">${stat('Test precision',pc(r.precision),'record level')}${stat('Test recall',pc(r.recall),'record level')}${stat('Test F0.5',pc(r.f05),'threshold '+r.threshold)}${stat('Search-space cut',r.reduction+'%','blocking: '+n0(r.candidates)+' pairs')}</div>
 <div class="grid g2"><div class="card"><h3>Records per split</h3><table><tr><th>Split<th>Source 1<th>Source 2<th>Source 3<th>Linked S1</tr>${Object.entries(S).map(([k,s])=>`<tr><td><b>${k}</b><td>${n0(s[1].n)}<td>${n0(s[2].n)}<td>${n0(s[3].n)}<td>${n0(o.gt[k].s2+o.gt[k].s3+o.gt[k].both)}</tr>`).join('')}</table></div>
 <div class="card"><h3>Data quality (all splits)</h3><table><tr><th>Source<th>Rows<th>Avg name len<th>Unique names<th>Missing addr<th>Missing country</tr>${q(1)}${q(2)}${q(3)}</table></div></div>
 <div class="grid g2"><div class="card"><h3>Countries (all sources)</h3>${bars(Object.entries(cty).sort((a,b)=>b[1]-a[1]))}</div><div class="card"><h3>Ground truth: how Source 1 links out (test)</h3>${bars([['S1 only',o.gt.test.none],['S1 + S2',o.gt.test.s2],['S1 + S3',o.gt.test.s3],['S1 + S2 + S3',o.gt.test.both]])}<p class="mut">Champion on candidate pairs — precision ${pc(ch.precision)}, recall ${pc(ch.recall)}.</p></div></div>
 <div class="card"><h3>Pipeline</h3><div class="pipe"><div>TSV load<small>3 sources</small></div><div>Normalise<small>legal suffix · abbreviations</small></div><div>Blocking<small>multi-key</small></div><div>16 similarity features<small>name · address · country</small></div><div>RF · LR · GB<small>validated</small></div><div>Threshold F0.5<small>precision-first</small></div><div>1-to-1 assignment<small>matching_results.tsv</small></div></div></div>`};

P['/project']=async()=>{const f=await get('/api/files');let st={sp:'test',sr:1,q:'',pg:0};
 const draw=async()=>{const d=await (await fetch(`/api/explore/${st.sp}/${st.sr}?q=${encodeURIComponent(st.q)}&page=${st.pg}`)).json();$('#ex').innerHTML=`<div class="tw"><table><tr><th>entity_id<th>name<th>address<th>country</tr>${d.rows.map(r=>`<tr><td class="mono">${r.entity_id}<td>${e(r.name)}<td>${e(r.address)}<td>${e(r.country)}</tr>`).join('')}</table></div>`+pager(d.total,st.pg,20)};PG=p=>{st.pg=p;draw()};
 setTimeout(()=>{['sp','sr'].forEach(i=>$('#'+i).onchange=x=>{st[i]=x.target.value;st.pg=0;draw()});$('#q').oninput=x=>{st.q=x.target.value;st.pg=0;draw()};draw()});
 return `<h2>Project & Data</h2><p class="sub">Everything inside the project zip — files, sizes, and a live browser over every TSV.</p><div class="grid g2"><div class="card"><h3>Files</h3><div class="tw" style="max-height:340px;overflow:auto"><table>${f.map(x=>`<tr><td class="mono">${x.path}<td class="mut">${x.kb} KB<td>${x.rows!=null?n0(x.rows)+' rows':''}</tr>`).join('')}</table></div></div>
 <div class="card"><h3>How to use real data</h3><p class="mut">Drop real files into <span class="mono">data/train</span> (train_source1/2/3.tsv + train_ground_truth.tsv), then run <span class="mono">python train.py</span>. Columns are auto-detected (id / name / address / country). Matching output: <span class="mono">outputs/matching_results.tsv</span>.</p><p><a href="/api/download/matching_results.tsv"><button>⬇ matching_results.tsv</button></a> <a href="/api/download/candidate_pairs.tsv"><button class="s">⬇ candidate_pairs.tsv</button></a></p></div></div>
 <div class="card"><h3>Data explorer</h3><div class="bar"><select id="sp"><option>train<option>validation<option selected>test</select><select id="sr"><option value=1>Source 1<option value=2>Source 2<option value=3>Source 3</select><input id="q" placeholder="search…" style="flex:1"></div><div id="ex" class="load">Loading…</div></div>`};

P['/map']=async()=>{const R=(await get('/api/result')).rows,N=R.length,cat={both:0,s2:0,s3:0,none:0};R.forEach(r=>{const a=r.matches.some(m=>m.source==2),b=r.matches.some(m=>m.source==3);cat[a&&b?'both':a?'s2':b?'s3':'none']++});
 const items=[['both','S1 + S2 + S3','#8b5cf6'],['s2','S1 + S2','#22d3ee'],['s3','S1 + S3','#f472b6'],['none','S1 only','#64748b']],H=210,sc=H/N;let ly=20,ry=20,svg='';
 items.forEach(([k,l,c])=>{const h=Math.max(cat[k]*sc,5);svg+=`<path d="M70 ${ly}C300 ${ly} 300 ${ry} 520 ${ry}L520 ${ry+h}C300 ${ry+h} 300 ${ly+h} 70 ${ly+h}Z" fill="${c}" opacity=".45"/><rect x="520" y="${ry}" width="14" height="${h}" rx="4" fill="${c}"/><text x="544" y="${ry+h/2+4}" style="fill:#eef0ff;font-size:12px">${l} · ${n0(cat[k])} (${(cat[k]/N*100).toFixed(1)}%)</text>`;ly+=cat[k]*sc;ry+=h+10});
 svg=`<svg viewBox="0 0 760 ${ry+10}" width="100%"><rect x="56" y="20" width="14" height="${H}" rx="4" fill="#fff"/><text x="0" y="14" style="fill:#eef0ff;font-weight:700">Source 1 · ${n0(N)}</text>`+svg+'</svg>';
 let q='';const draw=()=>{const L=R.filter(r=>r.matches.length&&(!q||(r.name+r.id).toLowerCase().includes(q.toLowerCase()))).slice(0,6);$('#pk').innerHTML=L.map(r=>`<tr class="k" onclick="window.ent('${r.id}')"><td class="mono">${r.id}<td>${e(r.name)}<td>${r.matches.map(chip).join('')}</tr>`).join('')};
 window.ent=id=>{const r=R.find(x=>x.id==id),ms=r.matches,h=70+ms.length*70;let s=`<svg viewBox="0 0 700 ${h}" width="100%"><rect x="10" y="${h/2-32}" width="210" height="64" rx="14" fill="#fff" opacity=".12" stroke="#fff5"/><text x="22" y="${h/2-8}" style="fill:#fff;font-weight:700">${e(r.name.slice(0,28))}</text><text x="22" y="${h/2+10}">${r.id} · anchor</text>`;
  ms.forEach((m,i)=>{const y=35+i*70,c=m.source==3?'#f472b6':'#22d3ee';s+=`<path d="M220 ${h/2}C330 ${h/2} 330 ${y} 440 ${y}" fill="none" stroke="${c}" stroke-width="${1+m.conf*5}" opacity=".8"/><text x="320" y="${(h/2+y)/2-4}" style="fill:${c}">${Math.round(m.conf*100)}%</text><rect x="440" y="${y-30}" width="250" height="60" rx="14" fill="${c}" opacity=".15" stroke="${c}"/><text x="452" y="${y-8}" style="fill:#fff;font-weight:700">${e(m.name.slice(0,30))}</text><text x="452" y="${y+10}">${m.id} · ${e(m.address.slice(0,28))}</text>`});
  const gn=[r.name,...ms.map(m=>m.name)].filter(x=>x!=x.toUpperCase()).sort((a,b)=>b.length-a.length)[0]||r.name;
  $('#ed').innerHTML=s+`</svg><div class="ev"><b>Golden record</b><br>${e(gn)} — ${e(r.address)}, ${e(r.country)}<br><span class="mut">merged from ${1+ms.length} sources · avg confidence ${pc(r.conf)}</span></div>`+ms.map(m=>`<div class="ev"><b>${m.id}</b> evidence${m.signals.map(g=>`<div class="row"><label>${g.signal}</label><div class="tr"><i style="width:${g.score*100}%"></i></div><em>${g.score}</em></div>`).join('')}</div>`).join('')};
 setTimeout(()=>{$('#s').oninput=x=>{q=x.target.value;draw()};draw();window.ent((R.find(r=>r.matches.length>1)||R[0]).id)});
 return `<h2>Entity Map</h2><p class="sub">How every Source 1 record resolves into Source 2 and Source 3 — the relationship map, then drill into any entity.</p><div class="card"><h3>Source 1 → Source 2 / Source 3 flow</h3>${svg}</div><div class="grid g2" style="margin-top:16px"><div class="card"><h3>Pick an entity</h3><input id="s" placeholder="search name or id" style="width:100%;margin-bottom:10px"><table id="pk"></table></div><div class="card"><h3>Relationship graph</h3><div id="ed"></div></div></div>`};

P['/matches']=async()=>{const R=(await get('/api/result')).rows.filter(r=>r.matches.length);let st={q:'',sr:0,mc:0,pg:0,o:null};
 const draw=()=>{const L=R.filter(r=>(!st.q||(r.id+r.name+r.matches.map(m=>m.id+m.name).join()).toLowerCase().includes(st.q.toLowerCase()))&&(!st.sr||r.matches.some(m=>m.source==st.sr))&&r.conf*100>=st.mc),p=L.slice(st.pg*15,st.pg*15+15);
  $('#o').innerHTML=`<div class="tw"><table><tr><th>Source 1<th>Name<th>Address<th>Matched records<th>Conf.</tr>${p.map(r=>`<tr class="k" onclick="PG.t('${r.id}')"><td class="mono">${r.id}<td>${e(r.name)}<td>${e(r.address)}<td>${r.matches.map(chip).join('')}<td>${pc(r.conf)}</tr>`+(st.o==r.id?`<tr><td colspan=5>${r.matches.map(m=>`<div class="ev"><b>${m.id}</b> ${e(m.name)} — ${e(m.address)}${m.signals.map(g=>`<div class="row"><label>${g.signal}</label><div class="tr"><i style="width:${g.score*100}%"></i></div><em>${g.score}</em></div>`).join('')}</div>`).join('')}</tr>`:'')).join('')}</table></div>`+pager(L.length,st.pg,15)};
 PG=p=>{st.pg=p;draw()};PG.t=id=>{st.o=st.o==id?null:id;draw()};
 setTimeout(()=>{$('#q').oninput=x=>{st.q=x.target.value;st.pg=0;draw()};$('#sr').onchange=x=>{st.sr=+x.target.value;st.pg=0;draw()};$('#mc').oninput=x=>{st.mc=+x.target.value;$('#mv').textContent=st.mc+'%';st.pg=0;draw()};draw()});
 return `<h2>Matching records</h2><p class="sub">${n0(R.length)} Source 1 records resolved to at least one record. Click a row for signal-level evidence.</p><div class="card"><div class="bar"><input id="q" placeholder="search id / name…" style="flex:1"><select id="sr"><option value=0>All sources<option value=2>Source 2<option value=3>Source 3</select><label class="mut">min confidence <span id="mv">0%</span> <input id="mc" type="range" min="0" max="100" value="0"></label></div><div id="o"></div></div>`};

P['/unmatched']=async()=>{const U=await get('/api/unmatched');let st={t:'s1',q:'',pg:0};
 const draw=()=>{const L=U[st.t].filter(r=>!st.q||JSON.stringify(r).toLowerCase().includes(st.q.toLowerCase())),p=L.slice(st.pg*15,st.pg*15+15),a=st.t=='s1';
  $('#o').innerHTML=`<div class="tw"><table><tr><th>ID<th>Name<th>Address<th>Country${a?'<th>Closest candidate<th>Score':''}</tr>${p.map(r=>`<tr><td class="mono">${r.id}<td>${e(r.name)}<td>${e(r.address)}<td>${e(r.country)}${a?`<td>${r.best?e(r.best_name)+' <span class="mono mut">'+r.best+'</span>':'<span class="mut">no candidate</span>'}<td><span class="chip no">${(r.score*100).toFixed(1)}%</span>`:''}</tr>`).join('')}</table></div>`+pager(L.length,st.pg,15)};PG=p=>{st.pg=p;draw()};
 setTimeout(()=>{$('#t').onchange=x=>{st.t=x.target.value;st.pg=0;draw()};$('#q').oninput=x=>{st.q=x.target.value;st.pg=0;draw()};draw()});
 return `<h2>Unmatched records</h2><p class="sub">Records without a confident partner. For Source 1 we show the closest rejected candidate — why the model said no.</p><div class="grid g4">${stat('Source 1 singletons',n0(U.s1.length),'no match found')}${stat('Orphan Source 2',n0(U.s2.length),'not claimed by any S1')}${stat('Orphan Source 3',n0(U.s3.length),'not claimed by any S1')}</div><div class="card"><div class="bar"><select id="t"><option value="s1">Source 1 singletons<option value="s2">Orphan Source 2<option value="s3">Orphan Source 3</select><input id="q" placeholder="search…" style="flex:1"></div><div id="o"></div></div>`};

P['/lab']=async()=>{const m=await get('/api/metrics'),M=m.models,N=Object.keys(M);let ch=M[m.champion];
 setTimeout(()=>{const s=$('#th'),f=()=>{const c=ch.curve.reduce((a,b)=>Math.abs(b.t-s.value/100)<Math.abs(a.t-s.value/100)?b:a);$('#tv').innerHTML=`threshold <b>${c.t}</b> → precision <b>${pc(c.precision)}</b> · recall <b>${pc(c.recall)}</b> · F0.5 <b>${pc(c.f05)}</b> · FP ${c.fp} · FN ${c.fn}`};s.oninput=f;f()});
 const cm=ch.test,imp=Object.entries(m.models['Random Forest'].importance).sort((a,b)=>b[1]-a[1]).slice(0,10);
 return `<h2>Model Lab</h2><p class="sub">Random Forest, Logistic Regression and Gradient Boosting — trained on train, threshold tuned on validation, scored on untouched test pairs. Champion: <b>${m.champion}</b>.</p>
 <div class="card"><div class="tw"><table><tr><th>Model<th>Val F0.5<th>Precision<th>Recall<th>F1<th>Test F0.5<th>ROC-AUC<th>PR-AUC<th>Thr.</tr>${N.map(k=>{const t=M[k].test;return `<tr><td><b>${k}</b> ${k==m.champion?'<span class="chip ok">champion</span>':''}<td>${pc(M[k].val_f05)}<td>${pc(t.precision)}<td>${pc(t.recall)}<td>${pc(t.f1)}<td>${pc(t.f05)}<td>${M[k].auc.toFixed(4)}<td>${M[k].ap.toFixed(4)}<td>${M[k].threshold.toFixed(2)}</tr>`}).join('')}</table></div></div>
 <div class="grid g2" style="margin-top:16px"><div class="card"><h3>ROC curves</h3>${line(N.map(k=>({name:k,pts:M[k].roc})))}</div>
 <div class="card"><h3>Precision / recall vs threshold (${m.champion})</h3>${line([{name:'Precision',pts:ch.curve.map(c=>[c.t,c.precision])},{name:'Recall',pts:ch.curve.map(c=>[c.t,c.recall])},{name:'F0.5',pts:ch.curve.map(c=>[c.t,c.f05])}])}<input id="th" type="range" min="5" max="95" step="5" value="${Math.round(ch.threshold*20)*5}" style="width:100%"><p id="tv" class="mut"></p></div></div>
 <div class="grid g2"><div class="card"><h3>Confusion matrix (${m.champion}, test pairs)</h3><table style="text-align:center"><tr><th><th>Pred match<th>Pred non-match</tr><tr><th>Actual match<td><span class="chip ok">TP ${n0(cm.tp)}</span><td><span class="chip no">FN ${n0(cm.fn)}</span></tr><tr><th>Actual non-match<td><span class="chip no">FP ${n0(cm.fp)}</span><td><span class="chip ok">TN ${n0(cm.tn)}</span></tr></table></div>
 <div class="card"><h3>What drives a match (Random Forest importance)</h3>${bars(imp.map(([k,x])=>[k,x,(x*100).toFixed(1)+'%']))}</div></div>`};

P['/live']=async()=>{const r0=(await get('/api/result')).rows.find(x=>x.matches.length);setTimeout(()=>{$('#go').onclick=async()=>{const b={name:$('#n').value,address:$('#a').value,country:$('#c').value};$('#lr').innerHTML='<div class="load">Scoring…</div>';const d=await (await fetch('/api/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json();
  $('#lr').innerHTML=d.length?`<table><tr><th>Candidate<th>Name<th>Address<th>Probability<th>Verdict</tr>${d.map(x=>`<tr><td class="mono">${x.id}<td>${e(x.name)}<td>${e(x.address)}<td>${pc(x.prob)}<td><span class="chip ${x.match?'ok':'no'}">${x.match?'match':'no match'}</span></tr>`).join('')}</table>`:'<p class="mut">No candidates found.</p>'};
  $('#up').onclick=async()=>{const f=new FormData();['f1','f2','f3'].forEach((k,i)=>f.append('s'+(i+1),$('#'+k).files[0]));$('#ur').innerHTML='<div class="load">Running pipeline…</div>';const r=await fetch('/api/run',{method:'POST',body:f}),d=await r.json();
   $('#ur').innerHTML=d.error?`<p class="chip no">${e(d.error)}</p>`:`<div class="grid g4">${stat('Records',n0(d.stats.total_s1))}${stat('Matched',n0(d.stats.with_matches))}${stat('Singletons',n0(d.stats.singletons))}${stat('Pairs',n0(d.stats.pairs_matched))}</div>`+(d.stats.f05?`<p>Precision ${pc(d.stats.precision)} · recall ${pc(d.stats.recall)}</p>`:'')}});
 return `<h2>Live Matcher</h2><p class="sub">Type any business and the trained model searches Source 2 and Source 3 for its counterparts in real time.</p><div class="card"><div class="bar"><input id="n" placeholder="Business name" value="${e(r0.name)}" style="flex:2"><input id="a" placeholder="Address" value="${e(r0.address)}" style="flex:2"><input id="c" placeholder="Country" value="${e(r0.country)}"><button id="go">Resolve</button></div><div id="lr" class="tw"></div></div>
 <div class="card" style="margin-top:16px"><h3>Bring your own data</h3><p class="mut">Upload three TSVs (entity_id, name, address, country) and run the full pipeline.</p><div class="bar"><input type="file" id="f1"><input type="file" id="f2"><input type="file" id="f3"><button id="up">Run pipeline</button></div><div id="ur"></div></div>`};

async function route(){const h=(location.hash.slice(1)||'/');document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#'+h));v.innerHTML='<div class="load">Loading…</div>';try{v.innerHTML=await (P[h]||P['/'])()}catch(x){v.innerHTML='<div class="card">Could not load: '+e(x)+'</div>'}scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script></body></html>
